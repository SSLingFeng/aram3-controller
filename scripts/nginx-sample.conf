# Aram3 Controller + Nginx 反向代理示例
# 二选一：根路径转发 或 子路径 /aram3/ 转发

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream aram3_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name aram3.example.com;

        # ---------- 方式 A：站点根路径转发 ----------
        # 前端构建使用默认 VITE_BASE=/  VITE_API_BASE=/api/v1
        location / {
            proxy_pass         http://aram3_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_read_timeout 300s;
            client_max_body_size 4g;
        }

        # SPA 历史路由回退（若由 Nginx 直接托管 static，可改为 try_files）
        # location / {
        #     root /opt/aram3/static;
        #     try_files $uri $uri/ /index.html;
        # }

        # ---------- 方式 B：子路径 /aram3/ ----------
        # 构建前设置：
        #   VITE_BASE=/aram3/
        #   VITE_API_BASE=/aram3/api/v1
        # npm run build 后再启动后端
        #
        # location /aram3/ {
        #     proxy_pass         http://aram3_backend/;   # 末尾斜杠：去掉 /aram3 前缀
        #     proxy_http_version 1.1;
        #     proxy_set_header   Host              $host;
        #     proxy_set_header   X-Real-IP         $remote_addr;
        #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header   X-Forwarded-Proto $scheme;
        #     client_max_body_size 4g;
        # }
        #
        # location = /aram3 {
        #     return 301 /aram3/;
        # }
    }
}
